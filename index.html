          "@type": "Question",
          "name": "Apakah KiniKerja tersedia sebagai aplikasi mobile?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ya, Kerja Kita tersedia sebagai Progressive Web App (PWA) yang dapat diinstal di Android dan iOS langsung dari browser tanpa perlu download di Play Store atau App Store. Karyawan dapat mengakses fitur absensi GPS, slip gaji, pengajuan cuti, KPI, dan lainnya dari smartphone mereka."
          }
        },
        {
          "@type": "Question",
          "name": "Bagaimana keamanan data di KiniKerja?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kerja Kita menggunakan enkripsi end-to-end, row-level security (RLS), role-based access control (RBAC), multi-tenant data isolation, dan audit log lengkap. Data disimpan di infrastruktur cloud Supabase dengan standar keamanan enterprise. Semua koneksi dilindungi HTTPS dan HSTS."
          }
        },
        {
          "@type": "Question",
          "name": "Apakah KiniKerja cocok untuk perusahaan kecil (UMKM)?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "Apakah absensi KiniKerja bisa digunakan secara offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kerja Kita menyediakan absensi offline terbatas melalui PWA: clock-in saat offline diantrekan di perangkat (IndexedDB) lalu tersinkronisasi otomatis saat internet kembali. Fitur lain membutuhkan koneksi internet."

          "@type": "Question",
          "name": "Apakah KiniKerja mendukung perhitungan BPJS dan PPh 21?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
