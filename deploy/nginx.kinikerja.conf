# Nginx reverse proxy for KiniKerja on VPS (VPS-only deploy, no Vercel)
# Install: copy to /etc/nginx/sites-available/kinikerja
#   ln -s /etc/nginx/sites-available/kinikerja /etc/nginx/sites-enabled/
#   certbot --nginx -d kinikerja.id -d www.kinikerja.id
#   nginx -t && systemctl reload nginx
#
# Notes:
# - Node (server/index.js) is the canonical source for CSP + Cache-Control.
#   Headers below are defense-in-depth at the edge (nginx always_add_header so
#   they apply on proxied 4xx/5xx too).
# - Body limit matches express.json({ limit: '1mb' }) — mismatched limits
#   cause confusing 413s from one layer but not the other.

# Rate-limit buckets (shared memory, per nginx worker set)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

upstream kinikerja_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name kinikerja.id www.kinikerja.id;

    # Uncomment after certbot (or let certbot manage the redirect):
    # return 301 https://$host$request_uri;

    # Must match express.json({ limit: '1mb' }) in server/index.js
    client_max_body_size 1m;

    # ── Edge security headers (defense-in-depth; Node sets CSP per-request) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(self), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-DNS-Prefetch-Control "on" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # HSTS: only enable once HTTPS (certbot) is live. Uncomment below then.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Never cache: service worker, manifest, SW bootstrap, API ──
    location = /sw.js {
        proxy_pass http://kinikerja_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.json {
        proxy_pass http://kinikerja_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
    }

    location = /register-sw.js {
        proxy_pass http://kinikerja_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
    }

    # ── API: rate-limited, never cached ──
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://kinikerja_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Immutable: Vite hashed assets + face-api models (1 year) ──
    location /assets/ {
        proxy_pass http://kinikerja_node;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Long-lived cache for face-api models (versioned weight files)
    location /models/ {
        proxy_pass http://kinikerja_node;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ── Short cache (NOT immutable): landing screenshots, PWA icons ──
    location /landing/ {
        proxy_pass http://kinikerja_node;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public" always;
    }

    location /icons/ {
        proxy_pass http://kinikerja_node;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public" always;
    }

    location / {
        proxy_pass http://kinikerja_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

